# Supabase CLI configuration for the सरकार Record Index project.
# Link a project first:  supabase link --project-ref <ref>

project_id = "sarkar-record-index"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "https://*.vercel.app/auth/callback"]
jwt_expiry = 3600
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
policy = "per_worker"

[functions.chat]
verify_jwt = false

[functions.ingest]
verify_jwt = false
